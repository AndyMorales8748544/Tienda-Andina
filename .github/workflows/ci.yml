name: CI - Tienda Andina

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Build, Lint y Pruebas

    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Analisis estatico
        run: npm run lint

      - name: Pruebas unitarias e integracion
        run: npm test

      - name: Quality Gate - Cobertura minima 70%
        shell: bash
        run: |
          set -o pipefail
          npm run coverage | tee coverage-report.txt

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E
        run: npm run test:e2e

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: coverage-report.txt

      - name: Publicar reporte Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: playwright-report/
