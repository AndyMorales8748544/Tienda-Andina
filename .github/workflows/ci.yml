name: CI - Tienda Andina

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Build, Lint y Pruebas

    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Analisis estatico
        run: npm run lint

      - name: Pruebas unitarias e integracion
        run: npm test

      - name: Quality Gate - Cobertura minima 70%
        shell: bash
        run: |
          set -o pipefail
          npm run coverage | tee coverage-report.txt

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E
        run: npm run test:e2e

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: coverage-report.txt

      - name: Publicar reporte Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: playwright-report/
      - name: Security - npm audit
        run: npm audit --audit-level=high

      - name: Security - Construir imagen Docker
        run: docker build -t tienda-andina:security .

      - name: Security - Escaneo Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "tienda-andina:security"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"
          vuln-type: "os,library"
          scanners: "vuln"

      - name: Verificar funcionamiento de imagen
        run: |
          docker run -d --name tienda-smoke \
            -p 127.0.0.1:3000:3000 \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            tienda-andina:security

          sleep 5

          if curl --fail --retry 10 --retry-all-errors \
            --retry-delay 2 --max-time 5 \
            http://127.0.0.1:3000/api; then
            echo "Smoke Test aprobado"
          else
            docker logs tienda-smoke
            exit 1
          fi

      - name: Limpiar contenedor de prueba
        if: always()
        run: docker rm -f tienda-smoke || true
