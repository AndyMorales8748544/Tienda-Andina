services:
  tienda-andina:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: tienda-andina

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/data/tienda.db
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET requerido}
      COOKIE_SECURE: "false"

    volumes:
      - tienda-data:/app/data

    restart: unless-stopped

volumes:
  tienda-data:
